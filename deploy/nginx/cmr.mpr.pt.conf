server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cmr.mpr.pt;

    ssl_certificate /etc/letsencrypt/live/cmr.mpr.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmr.mpr.pt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cmrmpr;
    index index.html;
    client_max_body_size 100M;

    # Aplicados a todas as respostas do domínio (SPA + API proxiada), não só
    # ao SPA: a ausência de HSTS/CSP e o âmbito anterior (só em "location /")
    # deixavam as respostas de /auth, /rest, /storage e /functions sem estes
    # cabeçalhos. O CSP é compatível com o que o frontend carrega hoje
    # (Tailwind via CDN + Google Fonts); tudo o resto é first-party.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # connect-src inclui https://pri.mpr.pt: o ecrã Faturação chama esse
    # domínio diretamente do browser (primaveraBillingService.ts) para ler
    # dados de faturação do Primavera — é o único destino cross-origin que a
    # app contacta a partir do frontend.
    # script-src precisa de 'unsafe-eval' e blob: (com worker-src a
    # acompanhar): o Tailwind Play CDN compila as classes utilitárias em
    # tempo real no browser via eval/Function e usa um Web Worker carregado
    # de um blob: — sem isto o script nem dá erro visível, simplesmente não
    # gera nenhum CSS e a app fica sem qualquer estilo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.tailwindcss.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://pri.mpr.pt; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Zonas definidas em cmr-rate-limit.conf (incluído a partir do bloco
    # http{} principal do Nginx, ex.: /etc/nginx/conf.d/). Sem isto, o
    # gateway não impunha qualquer limite a /auth/v1/token (login) nem às
    # restantes rotas da API, deixando essa proteção inteiramente a cargo do
    # GoTrue/Edge Functions internos.
    location ~ ^/auth/v1/token(?:/|$) {
        limit_req zone=cmr_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location ~ ^/(auth|rest|realtime|storage|functions|graphql)/v1(?:/|$) {
        limit_req zone=cmr_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cmr.mpr.pt;
    return 301 https://$host$request_uri;
}
