# Zonas de limitação de pedidos para cmr.mpr.pt.
#
# Este ficheiro declara `limit_req_zone`, que só é válido no contexto http{}
# do Nginx — não pode viver dentro de um bloco server{} (por isso não está em
# cmr.mpr.pt.conf). Instalar em /etc/nginx/conf.d/cmr-rate-limit.conf (lido
# automaticamente pela maioria das instalações via "include
# /etc/nginx/conf.d/*.conf" dentro de http{} em /etc/nginx/nginx.conf) e
# recarregar o Nginx.
#
# cmr_auth: protege /auth/v1/token (login/refresh) contra força bruta.
# cmr_api: limite mais generoso para o resto da API proxiada.
limit_req_zone $binary_remote_addr zone=cmr_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cmr_api:10m rate=30r/s;
